<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadership Assessment - AceLearning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .card { border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .badge { font-size: 1rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
      <div class="col-md-8">
        <div class="card bg-white">
          <div class="card-body text-center p-5">
            <h1 class="display-4 mb-4 fw-bold">Leadership Assessment</h1>
            <p class="lead text-muted mb-4">
              Temukan gaya kepemimpinan Anda dalam 5 menit.<br>
              Dapatkan laporan lengkap dengan visualisasi radar chart.
            </p>
            <div class="mb-4">
              <span class="badge bg-primary me-2">✓ 10 Pertanyaan</span>
              <span class="badge bg-success me-2">✓ 5 Menit</span>
              <span class="badge bg-info">✓ Laporan PDF</span>
            </div>
            <a href="/assessment" class="btn btn-primary btn-lg px-5 py-3">
              Mulai Assessment →
            </a>
            <p class="text-muted mt-4 small">
              Gratis untuk 10 perusahaan pertama
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
